name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # 推送 Docker 镜像到 GHCR 需要
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 显式锁定安全版本，不依赖 go.mod 的 go 指令
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: Mellow/package-lock.json

      # 多架构 Docker 镜像：QEMU 让 Dockerfile 里的 apk 能在 arm64 下执行，
      # buildx 负责跨平台构建，login 用于把镜像推到 GHCR
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 失败即阻断，防止有漏洞的版本被发布
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # GoReleaser 的 upx 步骤依赖系统里的 upx 命令（见 .goreleaser.yaml 的 upx 段）
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      # Release 正文取自 CHANGELOG.md 里 `## INIS-cms vX.Y.Z` 段落（GITHUB_REF_NAME 即 tag）
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}