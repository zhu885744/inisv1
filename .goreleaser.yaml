# GoReleaser v2 配置：交叉编译 + 内嵌前端（-tags embed）+ GitHub Release
#
# 本地验证（不发布，产物在 dist/，版本号取「下一个补丁号-next」）：
#   goreleaser release --snapshot --clean
#
# 正式发布（推 tag 后由 .github/workflows/release.yml 自动执行）：
#   git tag v1.0.8 && git push origin v1.0.8
#
# 产物：inis_<version>_<os>_<arch>.tar.gz / .zip
#       单文件部署 —— 主题（Mellow 前端产物）已打进二进制，部署只要「二进制 + config 目录」。
version: 2

project_name: inis

before:
  hooks:
    # theme/theme_embed.go 用 //go:embed all:dist 打包 theme/dist，
    # 这里先把 Mellow 构建出来并同步过去（否则 -tags embed 编译失败）
    - node scripts/prepare-frontend.mjs
    - go mod download

builds:
  - id: inis
    main: .
    binary: inis
    # 内嵌主题：与 build.sh / build.bat 的「内嵌前端」模式一致
    tags:
      - embed
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      # 与 build.sh 同一套裁剪参数；Version 由 tag 注入（facade.Version 是 var）
      - -s -w -buildid=
      - -X inis/app/facade.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # 归档内文件的修改时间统一取提交时间，build 可复现
    mod_timestamp: '{{ .CommitTimestamp }}'

# UPX 压缩：内嵌前端后单个二进制有几十 MB，LZMA 通常还能再压掉一半以上。
# - macOS 跳过：Mach-O 压缩后容易破坏签名 / 公证（build.bat 也一直跳过 darwin）
# - 需要执行环境里装有 upx 命令（本地 / CI 都见下文说明）
upx:
  - enabled: true
    ids: [inis]
    goos: [linux, windows]
    # -9 + LZMA：体积最小，压缩耗时最长
    compress: best
    lzma: true

archives:
  - id: release
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Docker 镜像：把当前平台的二进制放进 alpine 运行镜像，多架构合并成一个 manifest 推到 GHCR。
# - 构建环境需要 buildx（CI 里由 docker/setup-buildx-action 提供；本地无 Docker 时会跳过或报错）
# - 本地 `--snapshot` 默认只构建不推送
dockers_v2:
  - ids: [inis]
    dockerfile: Dockerfile
    # 本地 --snapshot 不构建镜像（多数开发机没装 Docker；正式发布时才需要）
    disable: '{{ .IsSnapshot }}'
    images:
      - ghcr.io/zhu885744/inis
    tags:
      - '{{ .Version }}'
      # 预发布版本不打 latest
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: '{{ .ProjectName }}'
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.source: https://github.com/zhu885744/INIS-cms
      org.opencontainers.image.licenses: Apache-2.0

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# 自动 changelog 只作兜底：正式发布时 CI 会用 --release-notes 传入
# CHANGELOG.md 里本版本的段落（见 scripts/extract-release-notes.mjs），
# 该参数存在时 GoReleaser 不会再生成本段内容。
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^Merge pull request'
      - '^Merge branch'
  groups:
    - title: 新增
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: 修复
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: 其他
      order: 999

release:
  draft: false
  prerelease: auto
  name_template: 'INIS v{{ .Version }}'
  # 正文 = header + 发布说明 + footer。
  # 发布说明来自 CHANGELOG.md 的 `## INIS-cms vX.Y.Z` 段落，所以这里不要再写版本标题，
  # 否则会出现两个「vX.Y.Z」大标题。
  header: |
    > 单文件部署：下载对应平台的压缩包，解压后直接运行 `inis`，
    > 首次启动会在同级目录生成 `config`及 `runtime `日志相关。
  footer: |
    完整更新日志见压缩包内的 `CHANGELOG.md`（仓库根目录同名文件）。
